[project]
name = "encryption"
version = "0.1.0"
description = "Python implementation of ML-KEM (Kyber) and other encryption schemes."
readme = "README.md"
authors = [
    { name = "Michael Eden", email = "michael.eden100@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
